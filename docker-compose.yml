services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/chat-app
      # Sin valor, el backend genera un secreto random por proceso y lo avisa
      # por log (ver src/config/configuration.ts). Para que las sesiones
      # sobrevivan un reinicio, exportá JWT_SECRET antes de `docker compose up`.
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      UPLOADS_DIR: uploads
    depends_on:
      mongo:
        condition: service_healthy
    # Seedea datos de prueba y recién ahí levanta el server — así
    # `docker compose up` deja la API con datos listos en un solo comando,
    # sin pasos manuales. Se re-seedea en cada reinicio del contenedor
    # (ver nota en backend/README.md): intencional para un entorno de
    # evaluación/demo, no para producción.
    command: ["sh", "-c", "node dist/seed.js && node dist/main.js"]
    volumes:
      - backend-uploads:/app/uploads

volumes:
  mongo-data:
  backend-uploads:
