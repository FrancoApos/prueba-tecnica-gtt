services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Atado a loopback a propósito. Este Mongo no tiene autenticación (no hace
    # falta: el único que le habla es el backend, por la red interna del
    # compose), así que publicarlo como "27017:27017" lo dejaría escuchando en
    # *todas* las interfaces — cualquiera en la misma red Wi-Fi podría abrir la
    # base sin credenciales mientras el compose corre. Con el prefijo
    # 127.0.0.1 sigue siendo accesible desde esta máquina, que es lo único que
    # se quería (inspeccionarla con Compass o mongosh), y desde ningún otro
    # lado. Si no te hace falta ni eso, borrá el bloque `ports` entero: el
    # backend le llega igual, y para mirar la base está
    # `docker compose exec mongo mongosh`.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/chat-app
      # Sin valor, el backend genera un secreto random por proceso y lo avisa
      # por log (ver src/config/configuration.ts). Para que las sesiones
      # sobrevivan un reinicio, exportá JWT_SECRET antes de `docker compose up`.
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      UPLOADS_DIR: uploads
    depends_on:
      mongo:
        condition: service_healthy
    # Seedea datos de prueba y recién ahí levanta el server — así
    # `docker compose up` deja la API con datos listos en un solo comando,
    # sin pasos manuales. Se re-seedea en cada reinicio del contenedor
    # (ver nota en backend/README.md): intencional para un entorno de
    # evaluación/demo, no para producción.
    command: ["sh", "-c", "node dist/seed.js && node dist/main.js"]
    volumes:
      - backend-uploads:/app/uploads

volumes:
  mongo-data:
  backend-uploads:
